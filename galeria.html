<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria | Institucion Educativa John F Kennedy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header"><nav class="nav" aria-label="Navegacion principal"><a class="brand" href="index.html"><img class="brand-logo" src="assets/img/logo/Logo.JFK.png" alt="Logo Institucion Educativa John F Kennedy" /><span><strong>John F Kennedy</strong><span>Sede El Cinco</span></span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu"><span></span><span></span><span></span><span class="sr-only">Abrir menu</span></button><div class="nav-links" id="site-menu"><a href="index.html">Inicio</a><a href="nosotros.html">Nosotros</a><a href="noticias.html">Noticias</a><a href="galeria.html">Galeria</a><a href="personero.html">Personero</a><a href="chat.html">Chat IA</a><a href="contacto.html">Contacto</a><a class="nav-action" href="portal.html">Portal Estudiantes</a></div></nav></header>

    <main class="page-shell">
      <section class="page-hero compact reveal">
        <p class="eyebrow">Galeria</p>
        <h1>Momentos de nuestra sede</h1>
        <p class="lead">Espacios para fotografias de clases, eventos, proyectos y encuentros comunitarios.</p>
      </section>

      <section class="section gallery-grid" aria-label="Galeria de fotos">
        <button class="gallery-item large reveal" type="button" data-lightbox="Patio escolar"><div class="placeholder">Foto grande</div><span>Patio escolar</span></button>
        <button class="gallery-item reveal" type="button" data-lightbox="Aula de clase"><div class="placeholder">Foto</div><span>Aula de clase</span></button>
        <button class="gallery-item reveal" type="button" data-lightbox="Proyecto ambiental"><div class="placeholder">Foto</div><span>Proyecto ambiental</span></button>
        <button class="gallery-item reveal" type="button" data-lightbox="Actividad cultural"><div class="placeholder">Foto</div><span>Actividad cultural</span></button>
        <button class="gallery-item reveal" type="button" data-lightbox="Encuentro familiar"><div class="placeholder">Foto</div><span>Encuentro familiar</span></button>
      </section>
    </main>

    <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Vista ampliada de foto">
      <button class="lightbox-close" type="button" aria-label="Cerrar">X</button>
      <div class="lightbox-content">
        <div class="lightbox-frame">Imagen ampliada</div>
        <p class="lightbox-caption"></p>
      </div>
    </div>

    <footer class="footer"><div class="footer-inner"><span>Galeria institucional</span><a href="contacto.html">Compartir fotos</a></div></footer>
    <script src="main.js"></script>
  </body>
</html>
